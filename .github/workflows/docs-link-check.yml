# Optional: markdown link check for docs/**
name: Docs link check

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check_docs_links.py"
      - ".github/workflows/docs-link-check.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check_docs_links.py"
      - ".github/workflows/docs-link-check.yml"

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docsify local links
        run: python3 scripts/check_docs_links.py

      - name: External Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Pages = docs-root paths; images on nested pages = ../assets/…
          # (see scripts/check_docs_links.py). Lychee checks http(s) only.
          args: >-
            --verbose
            --no-progress
            --scheme https
            --scheme http
            --exclude localhost
            --exclude '%7B%7B'
            'docs/**/*.md'
          fail: true
